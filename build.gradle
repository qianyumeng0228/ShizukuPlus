plugins {
    id "idea"
    id "com.android.library" apply false
    id "com.google.devtools.ksp" version "2.3.6" apply false
    id "io.gitlab.arturbosch.detekt" version "1.23.6" apply false
}

idea.module {
    excludeDirs += file("out")
}

def getGitCommitCount() {
    try {
        // Pass null (not []) so the subprocess inherits the parent process environment (including PATH).
        // Passing an empty list strips env vars and prevents git from being found in non-standard PATH setups.
        return Integer.parseInt("git rev-list --count HEAD".execute((List) null, project.rootDir).text.trim())
    } catch (Exception ignored) {
        return 0
    }
}

def gitCommitCount = getGitCommitCount()
def baseVersionName = "13.6.0"
def versionCodeOverride = providers.gradleProperty("shizukuplusVersionCode")
    .orElse(providers.environmentVariable("SHIZUKUPLUS_VERSION_CODE"))
    .getOrNull()
def versionNameOverride = providers.gradleProperty("shizukuplusVersionName")
    .orElse(providers.environmentVariable("SHIZUKUPLUS_VERSION_NAME"))
    .getOrNull()
def resolvedVersionCode = versionCodeOverride != null && !versionCodeOverride.trim().isEmpty()
    ? Integer.parseInt(versionCodeOverride.trim())
    : gitCommitCount
def resolvedVersionName = versionNameOverride != null && !versionNameOverride.trim().isEmpty()
    ? versionNameOverride.trim()
    : "Shizuku+ ${baseVersionName}.r${resolvedVersionCode}"
ext {
    versionCode = resolvedVersionCode
    versionName = resolvedVersionName
}

subprojects {
    apply plugin: "io.gitlab.arturbosch.detekt"

    detekt {
        config.setFrom(files("$rootDir/detekt.yml"))
        buildUponDefaultConfig = true
        autoCorrect = true
    }

    dependencies {
        detektPlugins "io.gitlab.arturbosch.detekt:detekt-formatting:1.23.6"
    }

    plugins.withId("com.android.base") {
        android {
            compileSdk = 35
            buildToolsVersion = "35.0.0"
            defaultConfig {
                minSdk = 24
                targetSdk = 35
            }
            compileOptions {
                sourceCompatibility = JavaVersion.VERSION_21
                targetCompatibility = JavaVersion.VERSION_21
            }
        }
    }
}
